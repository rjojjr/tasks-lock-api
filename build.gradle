plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'maven-publish'
    id 'java-library'
}

def build = '23'

group = 'rjojjr.com.github'
//version = "1.2.1.$build-SNAPSHOT"
version = "2.0.0-RELEASE"

java {
    sourceCompatibility = JavaVersion.VERSION_17
}


repositories {
    mavenCentral()
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    // TODO - Add separate client build job that doesn't carry all this DB code bloat(?)
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'org.springframework.boot:spring-boot-starter-web'
    compileOnly 'org.projectlombok:lombok:1.18.32'
    annotationProcessor 'org.projectlombok:lombok:1.18.32'
    runtimeOnly "com.mysql:mysql-connector-j:8.2.0"
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'com.h2database:h2'
}

test {
    useJUnitPlatform()
}

java {
    withSourcesJar()
}

publish {
    dependsOn assemble
}

jar {
    enabled = true
}

dependencyManagement {
    imports {
        mavenBom("org.springframework.boot:spring-boot-dependencies:4.1.2")
    }
}

publishing {
    repositories {
        maven {
            credentials {
                username project.properties['username']
                password project.properties['password']
            }
            // change to point to your repo, e.g. http://my.org/repo
            url = 'http://192.168.1.149:8091/snapshots'
            allowInsecureProtocol = true
        }
    }
    publications {
        mavenPublish(MavenPublication) {
            versionMapping {
                usage('java-api') {
                    fromResolutionOf('runtimeClasspath')
                }
                usage('java-runtime') {
                    fromResolutionResult()
                }
            }
            groupId = 'rjojjr.com.github'
            artifactId = 'tasks-lock-api'
            version = version

            from components.java
        }

    }
}
