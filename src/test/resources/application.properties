spring.application.name=tasks-lock-api
# Run the API mode against an in-memory H2 database for tests
tasks-lock.api.enabled=true
spring.datasource.url=jdbc:h2:mem:tasks_lock_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
